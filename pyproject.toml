[project]
name = "basic-akgents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jettro Coenradie", email = "jettro@coenradie.com" }
]
requires-python = ">=3.12"
dependencies = [
    "akgentic-core>=1.5.4",
    "akgentic-team[cli]>=1.5.4",
]

[project.scripts]
basic-akgents = "basic_akgents:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "ASYNC", "C901", "PLR0912", "PLR0915"]
ignore = ["E501", "ANN401", "N802"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # skip annotation rules in test files
# TYPE_CHECKING block re-exports the lazily-imported public API for type
# checkers/IDEs; the names are intentionally not referenced at runtime.
"src/ingestion_core/__init__.py" = ["F401"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50
